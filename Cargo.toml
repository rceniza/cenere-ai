[package]
name = "cenere-ai"
version = "0.1.0"
edition = "2021"
description = "A small local coding assistant with SQLite memory and a Rust CLI/web interface"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.5.1", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
