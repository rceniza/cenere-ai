name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rust, Python, and Docker checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.3"

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Run training data tests
        run: python -m unittest discover -s training/tests -v

      - name: Verify curriculum data is reproducible
        run: python3 curriculum/datasets/build_multistack_v1.py --check

      - name: Verify code-focused training data is reproducible
        run: python3 curriculum/datasets/build_multistack_v2.py --check

      - name: Verify ecosystem training data is reproducible
        run: python3 curriculum/datasets/build_multistack_v3.py --check

      - name: Verify correction and coding training data is reproducible
        run: python3 curriculum/datasets/build_multistack_v4.py --check

      - name: Verify problem-solving training data is reproducible
        run: python3 curriculum/datasets/build_problem_solving_v1.py --check

      - name: Verify evidence-led problem-solving data is reproducible
        run: python3 curriculum/datasets/build_problem_solving_v2.py --check

      - name: Verify advanced tool-feedback problem-solving data is reproducible
        run: python3 curriculum/datasets/build_problem_solving_v3.py --check

      - name: Verify executable patch-repair training data is reproducible
        run: python3 curriculum/datasets/build_problem_solving_v4.py --check

      - name: Verify Go and C# problem-solving training data is reproducible
        run: python3 curriculum/datasets/build_problem_solving_v5.py --check

      - name: Compile and run polyglot exercise
        run: python3 curriculum/examples/polyglot/check.py --require rust,c,cpp,python,node,typescript,php,go,java,csharp

      - name: Build production container
        run: docker build --tag cenere-ai:ci .
